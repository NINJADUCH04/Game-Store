services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: game_store
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store_user -d game_store"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://store_user:securepassword@db:5432/game_store
      SECRET_KEY: docker-secret-key-change-in-production
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    command: >
      sh -c "sleep 10 &&
             alembic upgrade head &&
             python scripts/import_csv.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
